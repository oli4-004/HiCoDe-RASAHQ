version: "3.1"

nlu:
  - intent: greet
    examples: |
      - hey
      - hi
      - hello
      - hi there
      - good morning
      - good afternoon

  - intent: goodbye
    examples: |
      - ciao
      - goodbye
      - later
      - bye
      - see you
      - see you later

  # User is lost AND explicitly asks for directions (no abbreviations here)
  - intent: lost_vague
    examples: |
      - I am lost on campus, can you give me directions?
      - I'm kind of lost on campus, can you help me find my way?
      - I don't know how to get to my lecture building, can you guide me?
      - I can't find my lecture building, can you show me the way?
      - I don't know where I should go for my class, can you help?
      - I'm at the campus but I don't know where my building is, I need directions
      - I need help finding my way to my exam location
      - I'm really lost, can you guide me to the right building?

  # One side known OR explicit "need directions to X"
  - intent: lost_partial
    examples: |
      - I'm at the Huygens building and need directions
      - I'm at Huygens, how do I get to my exam building?
      - I'm at Station Heyendaal and need to get to campus, how do I walk?
      - I'm in Erasmus and need directions to another building
      - I need directions to Maria Montessori
      - I need directions to the Lecture Hall Complex
      - I want directions to the Elinor Ostrom Building
      - How do I get to the Grotius Building from here?
      - Can you show me the way to Huygens from here?

  # Both origin and destination explicit: clear routing problem
  - intent: lost_concrete
    examples: |
      - I'm at the Huygens building. How do I get to Maria Montessori?
      - I'm behind EOS. Where's the nearest entrance to Huygens?
      - I'm in Erasmus, how do I get to the Lecture Hall Complex?
      - I'm at Station Heyendaal, how do I walk to the Elinor Ostrom Building?
      - I'm in Grotius, how do I get to Maria Montessori?
      - I'm at the Elinor Ostrom Building, how do I get to the Huygens Building?
      - I'm at Maria Montessori, how do I get to Spinoza?

  # Abbreviations & room codes: ALL questions about "what is X / what does X mean / which building is X"
  - intent: abbreviation
    examples: |
      - What does EOS mean?
      - What is EOS?
      - I don't know what EOS means
      - I am confused about EOS
      - EOS?
      - Is EOS a building?
      - Is that EOS a building?
      - What does HG stand for?
      - I also don't know what HG means
      - HG?
      - What is HG?
      - I have a class at HG00.616, what building is that?
      - HG 0.70, which building is that?
      - HG00.616
      - HG 0.70
      - LIN 5, which lecture hall is that?
      - LIN 5
      - What building is MM?
      - What is the abbreviation MM?
      - MM?
      - MM 0.010
      - I am not sure what CC means
      - What is CC?
      - Which building is CC1 in?
      - CC1
      - CC2
      - I don't understand these building codes
      - I don't understand these abbreviations
      - Can you explain these abbreviations?
      - I'm confused about these building codes
      - I've got an exam in TvA
      - I've got an exam in TVA, what building is that?
      - I am confused about TvA as well
      - I'm confused about TVA
      - What is TvA?
      - TvA, what building is that?
      - TVA?
      - tva?
      - tva
      - What does TVA stand for?
      - What is TVA short for?
      - And TVA?
      - And EOS?
      - And MM?
      - And LIN?
      - And CC?

  - intent: thank_you
    examples: |
      - thanks
      - thank you
      - thx
      - appreciate it
      - that's helpful
      - cheers
      - yes, that's clear
      - yes, I found it
      - yes, got it
      - yeah that's helpful
  

