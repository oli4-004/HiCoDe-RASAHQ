  # ---------------------------------------------------------------------------
  # TRANSPORT & ROUTES (WALK / BIKE / CAR / TRANSIT / PUBLIC TRANSPORT INFO)
  # ---------------------------------------------------------------------------

  route_patterns:
    description: |
      Detect when the user is asking how to get from one campus place to another,
      or how long it takes to travel between two places on or around campus.
  
      INTENTS:
      - Use the intent ask_route_description when the user mainly wants directions
        in words between two locations (for example "How do I get from A to B?").
      - Use the intent ask_travel_time when the user mainly wants to know how long
        it takes (walking/transit/bike/car) between two locations.
      - Use fastest_route_flow when the user is asking WHICH option is fastest/quickest
        (a comparison across modes), even if they do not name a mode.
  
      HIGH-LEVEL DECISION:
      - If the user clearly talks about WALKING, CYCLING, CAR, or a TRANSIT ROUTE
        (e.g. "from A to B by bus/train"), and mentions buildings/places, treat it as a route:
        → use ask_route_description and route_description_flow.
      - If the user clearly asks for PUBLIC TRANSPORT INFORMATION (which bus/train line,
        closest station/stop, bus stop near X, etc.), treat it as an OV-info question:
        → use public_transport_flow.
      - If the user asks WHICH option is FASTEST / QUICKEST (a comparison), for example:
        - "What is the quickest way?"
        - "Is walking the quickest?"
        - "Which is faster: bike or walking?"
        - "As fast as possible / zo snel mogelijk"
        and there are buildings/places involved:
        → use fastest_route_flow.
      - If the user mentions buildings/places but does NOT clearly specify
        walking/cycling/car/transit or OV-info ("How do I get to EOS?"):
        → start travel_mode_clarification_flow first, so the assistant can ask
          whether they prefer walking/cycling/car or public transport.
      - If the user is referring to the last route ("there/that/same route") and only changes mode
        ("by bike", "walking then", "can I go there cycling then?"):
        -> mode_switch_flow (reuse prev_*), not fallback_flow.
  
      RAW BUILDING SLOTS:
      - source_building_raw and target_building_raw:
        These store the raw building references exactly as the user phrases them,
        for example "HG", "COM B", "tandheelkunde", "the library", "MM", "EOS".
      - These raw slots are later read by a custom action (action_get_route_description),
        which internally normalizes them using the building documentation and the LLM.
        The patterns do NOT need to worry about canonical names or external APIs.
  
      STRICT RULES FOR RAW SLOTS:
      - The slots source_building_raw and target_building_raw MUST normally contain
        building names that the user explicitly mentioned in their own words
        (in the current or previous user messages).
      - EXCEPTION: if the most recent user message uses a referring expression like
        "there", "that place", "that building" or similar, and it clearly refers to a
        concrete building name that the assistant just mentioned in the immediately
        preceding turn (for example "Central Student Desk in the Berchmanianum"),
        then you MAY copy that assistant phrase into target_building_raw or
        source_building_raw as appropriate.
      - Do NOT invent or guess extra buildings, bus stops or locations based on
        your knowledge base.
      - If the user does not mention a starting point at all (e.g. "How do I
        get to EOS?"), only fill target_building_raw = "EOS" and leave
        source_building_raw empty so the flow can ask where the user is now.
      - If the user does NOT explicitly name their starting building, you MUST
        leave source_building_raw empty. Do NOT invent values like "here",
        "my location", "your location", "current location", or "user_location"
        for any building slot.
  
      BUILDING NAMES AND CODES:
      - Treat Radboud building names and codes as 'building', for example:
        Comenius, Comenius A, Comenius B, COM, COM A, COM B, CC, Collegezalencomplex,
        Erasmus, Erasmus building, Huygens, HG, Maria Montessori, MM, Dentistry,
        Tandheelkunde, UB (University Library), EOS, etc.
      - The knowledge base contains documents describing these buildings and their
        abbreviations. Use entities to mark obvious building names and codes, but
        keep the slot values as close as possible to what the user wrote or, in the
        exception above, to the clearly referenced assistant phrase.
      - If you are unsure, still try to map obvious campus building names to the
        building entity and to the appropriate slots, without inventing new names.
  
      FLOW BEHAVIOUR (route_description_flow):
      1) First, the flow collects source_building_raw and target_building_raw.
         - If the user mentions both buildings in the same message,
           you should extract them directly into these raw slots and avoid
           asking a follow-up question.
           Example:
             "I really need to go to COM for an exam but I'm still at Erasmus"
             => source_building_raw = "Erasmus", target_building_raw = "COM".
         - If only one building is given (for example "How do I get to COM?"),
           fill target_building_raw = "COM" and leave source_building_raw empty,
           so the flow can ask where the user is now.
         - If the user only mentions the source ("I'm at MM, how can I get there later?"),
           set source_building_raw = "MM" and keep target_building_raw empty so the flow
           can ask for the destination.
  
      2) After the raw slots are filled, the flow calls action_get_route_description.
         - This custom action:
           - reads source_building_raw and target_building_raw,
           - normalizes them with the building documentation and an LLM,
           - calls an internal routing API (Google Maps) for directions
             (walking, bicycling, driving, or transit depending on travel_mode_hint),
           - and returns a short, readable explanation to the user.
         - The patterns do NOT need to perform any extra search or normalization.
  
      DECIDING SOURCE VS TARGET:
      - For phrases like "from A to B":
        source_building_raw = A, target_building_raw = B.
      - For phrases like "to B but I'm (still) at A":
        target_building_raw = B, source_building_raw = A.
        Example: "I really need to go to COM for an exam but I'm still at Erasmus"
        => source_building_raw = "Erasmus", target_building_raw = "COM".
      - For "back to A" / "return to A":
        - If there was a previous route from A to B in this conversation, then a follow-up
          "How do I get back to A?" should swap the buildings:
          source_building_raw = previous target, target_building_raw = previous source.
  
      FOUR COMMON PHRASING CASES:
      1) The outward trip is mentioned explicitly:
         - "from A to B"
         => source_building_raw = A, target_building_raw = B.
      2) Only the source is mentioned:
         - "I'm at A and I have an exam later, how can I get there?"
         => source_building_raw = A, target_building_raw = "" (empty).
      3) Only the destination is mentioned:
         - "How do I get to EOS?"
         => target_building_raw = "EOS", source_building_raw = "" (empty).
         NEVER invent a fake origin such as "my location" or "user_location".
      4) No buildings are repeated, but the user refers to a previous route:
         - If the user says "And how do I get back?" after a route from A to B,
           reuse the previous buildings, swap them, and set
           source_building_raw = previous target, target_building_raw = previous source.
         - If the user instead says something like "How can I get there as quickly as possible?"
           and the previous assistant message clearly introduced a concrete destination
           (for example the Central Student Desk in the Berchmanianum), you may treat
           that destination as the current target_building_raw even if the user did not
           type the building name again.
  
      If you cannot clearly decide, still set the buildings based on the most
      likely reading of the user's message, but never fabricate buildings that
      were not mentioned or clearly referred to.
  
      WHEN NOT TO USE ROUTE_DESCRIPTION_FLOW:
      - If the question is primarily about public transport INFORMATION (e.g. which line,
        closest stop/station, bus stop near X), prefer public_transport_flow.
      - If the user is only asking for opening hours or what is inside
        a building, use the existing thematic flows or pattern_search instead.
  
      SLOT SETTING EXPECTATIONS:
      - For every route or travel-time request, fill:
        - source_building_raw and target_building_raw from the user's wording or,
          in the explicit referring-expression exception above, from the clearly
          referenced assistant phrase.
        - travel_mode_hint (see below), based ONLY on what the user actually says.
      - These slots may already be partially filled by travel_mode_clarification_flow;
        reuse existing values instead of asking again when possible.
      - When BOTH the origin and destination buildings are clearly mentioned in
        the same user message, you MUST fill BOTH source_building_raw and
        target_building_raw directly from that message.
      - In that case, you MUST NOT leave these slots empty and you MUST NOT
        trigger questions like "Where are you now?" or "Where do you want to go?"
        for this turn. The collect steps will reuse the filled slot values.
      - Only ask for a missing building via utter_ask_source_building_raw or
        utter_ask_target_building_raw when the user truly did NOT mention that
        building in any previous turn.
  
      TRAVEL MODE HINT:
      - Always set the slot travel_mode_hint to the user's preferred mode if they clearly mention it:
        - Words like "on foot", "by foot", "walking", "walk" → travel_mode_hint = "walk".
        - Words like "by bike", "bicycle", "cycling", "fiets" → travel_mode_hint = "bike".
        - Words like "by car", "with my car", "drive", "met de auto" → travel_mode_hint = "car".
        - Words like "by bus", "by train", "public transport", "OV", "NS", "Arriva"
          AND the user is asking for a route from A to B → travel_mode_hint = "transit".
        - Words like "which bus", "which train", "closest station", "bus stop near",
          "nearest stop", "which OV" → travel_mode_hint = "public_transport_info".
      - If the user only mentions campus buildings and does NOT mention any mode
        (no walking/cycling/car words and no transit/OV words, e.g. "How do I get to EOS?"),
        you MUST set travel_mode_hint = "unknown" and prefer
        travel_mode_clarification_flow to ask the user for their preference.
      - If the user asks WHICH option is FASTEST / QUICKEST (a comparison) and does not name a mode,
        you MUST set travel_mode_hint = "unknown" and use fastest_route_flow.
      - If you really cannot tell the mode from the wording, set travel_mode_hint = "unknown".
  
       VERY CONCRETE SLOT ASSIGNMENT EXAMPLES
  
      1) Example: "How do I get from EOS to Aesculaaf?"
         - intent: ask_route_description
         - slots MUST be:
           - source_building_raw = "EOS"
           - target_building_raw = "Aesculaaf"
           - travel_mode_hint = "unknown"
         - Because both buildings are present, you MUST NOT ask
           "Where are you now?" in this turn.
  
      2) Example: "Hey, how do I get from Huygens to the library by bike?"
         - intent: ask_route_description
         - slots MUST be:
           - source_building_raw = "Huygens"
           - target_building_raw = "the library"
           - travel_mode_hint = "bike"
         - Do NOT ask again for the buildings; they are already known.
  
      3) Example: "How do I get to EOS?"
         - intent: ask_route_description
         - slots MUST be:
           - source_building_raw = "" (empty / not set)
           - target_building_raw = "EOS"
           - travel_mode_hint = "unknown"
         - Because the origin is missing, it is correct that the flow will
           later ask: "Where are you now?".
  
      4) Example: "I am at MM, how can I get there later?"
         - If there is no previous destination in context:
           - intent: ask_route_description
           - slots:
             - source_building_raw = "MM"
             - target_building_raw = "" (empty / not set)
             - travel_mode_hint = "unknown"
           - The assistant may later ask where they want to go.
         - If there WAS a previous route from A to B and "there" clearly points
           to B, then:
             - source_building_raw = "MM"
             - target_building_raw = previous target building.
  
      5) Example follow-up: after a route from EOS to Aesculaaf,
         the user says: "And how do I get back?"
         - intent: ask_route_description
         - slots MUST be:
           - source_building_raw = prev_target_building_raw (here: "Aesculaaf")
           - target_building_raw = prev_source_building_raw (here: "EOS")
           - travel_mode_hint = "unknown" (unless a mode is clearly stated)
  
      These examples are binding: when the user message matches one of these
      patterns, you MUST set the slots exactly as shown.
  

  travel_mode_clarification_patterns:
    description: |
      This section explains when to use **travel_mode_clarification_flow** to
      ask the user whether they want to WALK/CYCLE/CAR or use PUBLIC TRANSPORT (TRANSIT).
  
      WHEN TO USE THIS FLOW:
      - The user asks how to get to or from one or more campus buildings,
        but does NOT clearly specify a travel mode.
        Examples:
        - "How do I get to EOS?"
        - "How do I get from MM to Huygens?"
        - "What is the best way to go from GR to EOS?"
      - In these cases, you MUST NOT guess the mode.
        Instead, start travel_mode_clarification_flow so the assistant can ask:
        "Do you want to walk, cycle, go by car, or use public transport (bus/train)?"
      - If the user asks WHICH option is fastest / quickest (a comparison),
        do NOT use this flow; use fastest_route_flow.
  
      SLOT BEHAVIOUR:
      - Before asking about the travel mode, this flow should silently fill
        source_building_raw and target_building_raw from the current user
        message wherever possible (no extra questions).
      - Then the flow collects the travel_mode_hint slot explicitly.
      - The user’s answer (e.g. "by foot", "by bike", "by car", "by bus") should update:
        - travel_mode_hint = "walk" / "bike" / "car" / "transit" as appropriate.
      - After this flow ends, a short follow-up like "by foot" / "by bus"
        will allow the next turn to go directly to:
        - route_description_flow when travel_mode_hint is "walk", "bike", "car" or "transit".
  
      RELATION TO OTHER FLOWS:
      - If the user already clearly specified a mode in the original question
        ("How do I walk from MM to Huygens?", "How do I get from Nijmegen Centraal to EOS by train?"),
        do NOT use travel_mode_clarification_flow; go directly to route_description_flow.
      - If the user asks for OV info instead of a route ("Which bus line to EOS?", "closest station"),
        do NOT use travel_mode_clarification_flow; use public_transport_flow.
      - If the user changes their mind, for example:
        - First: "Which bus line should I take to EOS?" → public_transport_flow.
        - Then: "I mean by foot." → treat the new message as a fresh query:
          travel_mode_hint = "walk" and use route_description_flow.
  

  public_transport_patterns:
    description: |
      This section describes how to recognise questions about public
      transport INFORMATION (OV info) to, from and around campus and map them to the
      appropriate flow.
  
      WHAT COUNTS AS A "PUBLIC TRANSPORT INFO" QUESTION
  
      Treat an utterance as public-transport-info-related when users:
      - Ask which bus/train/tram line to take, without asking for a full step-by-step route:
        - "Which bus should I take to EOS?"
        - "Which bus line goes to the UB?"
        - "What OV should I use to get to campus?"
      - Ask about stations and stops near a building:
        - "Which station is closest to Huygens?"
        - "Is there a bus stop near the University Library?"
      - Ask generally for the nearest stop/station for a campus location.
  
      DECISION LOGIC AND PRIORITY:
  
      - If the main focus is WHICH STATION / STOP / LINE / GENERAL OV INFO:
        → use public_transport_flow.
      - You should ONLY choose public_transport_flow when the user’s intent is clearly
        informational and they explicitly mention public transport concepts such as:
        - train, bus, tram, OV, NS, Arriva,
        - station, stop, bus stop, platform, line/route numbers,
        - "public transport" or "OV",
        AND they are not primarily requesting a step-by-step transit route.
  
      RELATION TO TRANSIT ROUTES (IMPORTANT):
  
      - If the user asks for a step-by-step transit route between two places,
        especially with "from A to B" phrasing (e.g. "How do I get from Nijmegen Centraal to Huygens by train?"):
        → do NOT use public_transport_flow.
        → use route_description_flow with travel_mode_hint = "transit".
      - If the user only says "How do I get to <building>?" or
        "How do I get from <building A> to <building B>?" without any
        explicit mode words, do NOT guess:
        → prefer travel_mode_clarification_flow first.
  
      TRAVEL MODE HINT FOR PUBLIC TRANSPORT INFO:
  
      - Whenever you decide that public_transport_flow is appropriate,
        you MUST set travel_mode_hint = "public_transport_info".
      - Example mappings:
        - "Which bus line should I take to EOS?" → travel_mode_hint = "public_transport_info".
        - "Which station is closest to Huygens?" → travel_mode_hint = "public_transport_info".
      - If the user later corrects themselves with something like
        "I mean by foot" / "I want to walk" / "I need the route by train from A to B",
        the new message should update travel_mode_hint accordingly ("walk" or "transit")
        and be routed to route_description_flow instead.
  
      MIXED QUESTIONS:
  
      - Mixed questions can happen, for example:
        - "Which bus goes to EOS, and how do I walk from the stop to MM?"
      - In such cases, choose the flow that best matches the *first or main*
        request in the user's message:
        - If they primarily ask which line/stop/station: prefer public_transport_flow.
        - If they primarily ask for step-by-step directions: prefer route_description_flow.
  
      STATE CLEANUP:
      - After public_transport_flow has answered, the custom action
        action_clear_route_context resets travel_mode_hint to "unknown"
        and clears source_building_raw and target_building_raw, so later
        messages start from a fresh route context.
  
      EXAMPLES (→ public_transport_flow)
  
      - "Which station is closest to Huygens?"
      - "Is there a bus stop near the University Library?"
      - "Which bus line should I take to EOS?"
      - "What OV should I use to get from the city centre to MM?"
  

  mode_switch_patterns:
    description: |
      Start: mode_switch_flow

      Use mode_switch_flow when the user’s message mainly means:
      "Re-run the LAST route, but change only the travel mode."
  
      This includes very short AND longer follow-ups, especially with referring language:
      - "by bike"
      - "walk!"
      - "by car then"
      - "and by bus?"
      - "same route but walking"
      - "can I go there cycling then?"
      - "could you do that by train instead?"
      - "what about by public transport?"
  
      Key signals:
      - Mentions a mode (walk/bike/car/bus/train/ov/public transport)
      - Uses "there / that / same route / then / instead"
      - Does NOT restate a new explicit A→B pair
  
      Decision rules:
      - Pure mode switch (walk/bike/car/transit) -> mode_switch_flow.
      - If the user asks PUBLIC TRANSPORT INFO ("which bus", "which line", "closest stop/station") -> public_transport_flow.
      - If they ask WHICH option is fastest/quickest -> fastest_route_flow.
      - If they provide a NEW explicit A→B route in the same message -> route_description_flow instead.
  

  fastest_route_patterns:
    description: |
      Use this when the user is asking WHICH travel mode is quickest/fastest,
      or whether a specific mode (walking/cycling/car/public transport) is the quickest.
  
      Start: fastest_route_flow
  
      Key idea:
      - This is NOT a request for step-by-step directions.
      - You must compare modes (walking, bicycling, driving, transit) and report:
        (a) which is fastest, and
        (b) the estimated time for each mode (or mark unavailable / not suggested).
  
      Typical examples:
      - "What is the quickest route and mode of transportation?"
      - "Is walking the quickest?"
      - "What's the fastest way to get from Huygens to Comenius?"
      - "Which is faster: biking or walking?"
      - "What’s the fastest option right now?"
      - "As fast as possible / zo snel mogelijk"
  
      Non-examples (use route_description_flow instead):
      - "Give me walking directions from HG to COM."
      - "Directions to Berchmanianum by car."
      
      Follow-up after a fastest-route answer:
      - "Ok cycling then" / "Then walking please" / "By bike then"
      -> mode_switch_flow (same A→B, new mode), not fallback_flow.

  # ---------------------------------------------------------------------------
  # OPENING HOURS, OTHER FACILITIES, STUDY SPOTS
  # ---------------------------------------------------------------------------

  opening_hours_patterns:
    description: |
      This section describes how to recognise generic opening-hours
      questions for buildings, services and venues and map them to
      opening_hours_flow.

      WHEN TO TREAT A QUESTION AS "OPENING HOURS"

      - The user explicitly mentions time, opening, closing:
        - "What time does the library close today?"
        - "Is EOS open on Saturday?"
        - "Until what time is De Refter open on Thursday?"
      - They combine a building or venue with words like "open",
        "close", "opening hours", "when":
        - "Is the prayer room open in the evening?"
        - "Is the parking garage by Gymnasion 24/7?"
      - They ask whether a facility is accessible on weekends, at night
        or during exams:
        - "Is the UB open on Sunday?"
        - "Does the MM building stay open in the evening?"

      DECISION LOGIC

      - If the main intent is to know WHEN it is open or closed:
        → use opening_hours_flow, regardless of whether the facility
          is a building, library, food venue, prayer room, parking
          garage, childcare, etc.
      - If the question is primarily about what the place IS or does
        with only a minor time remark ("what is De Refter and when is
        it open?"):
        - You may still use opening_hours_flow and give a short
          combined answer,
        - or use the relevant thematic flow (food_and_drink_flow,
          prayer_room_flow, other_facilities_flow) if the "what is it"
          aspect is stronger.
      - If no exact hours are known, say so clearly instead of
        inventing times.

      EXAMPLES (→ opening_hours_flow)

      - "Is P7b open at night?"
      - "When is Childcare Heyendael open?"
      - "What are the UB opening hours on Sunday?"
      - "How long is EOS open on Fridays?"

  other_facilities_patterns:
    description: |
      This section groups "other" campus facilities such as childcare,
      parking garages, and some general building facilities that are
      not purely food/drink, abbreviations, or prayer rooms.

      CHILDCARE / DAYCARE (KINDEROPVANG HEYENDAEL)

      - If the user mentions "childcare", "daycare", "Kinderopvang
        Heyendael", "Kinderdagverblijf", "campus daycare", or
        "KDV Heyendael", treat this as a childcare facility question.
      - Typical questions:
        - "Where is the daycare on campus?"
        - "Is there childcare on campus?"
        - "Is the daycare only for staff children?"
        - "How does Childcare Heyendael work?"

      PARKING GARAGES / MOBILITY

      - If the user mentions parking garages such as P7b (Gymnasion
        garage), Grotius or Huygens garages, or asks:
        - "Where can I park for EOS / Gymnasion / Huygens / GR?"
        - "Is the parking garage near Gymnasion 24/7?"
        - "How high is the parking garage by EOS?"
      - These are parking / mobility questions, not route directions:
        they are about where to park and what conditions apply.

      BICYCLES / BIKE PARKING

      - If the user mentions "bike parking", "bicycle shed", "fiets",
        "fiets parkeren", "fietsenstalling", "bike racks", "fietsrekken",
        or similar:
        - treat this as part of other_facilities_flow.
      - Typical examples:
        - "Where can I park my bike at MM?"
        - "Is there a bicycle parking near the library?"
        - "Where is the fietsenstalling by Huygens?"
        - "Can I lock my bike somewhere near EOS?"
      
      STUDENT CARD / STUDENTENKAART / COLLEGEKAART

      - When a user mentions a student card / student ID / studentenkaart / collegekaart
        (lost, stolen, broken, or needs a new one), this is an administrative campus
        service question, not mental health.
      - Typical examples:
        - "I lost my student card, where can I get a new one?"
        - "Where can I replace my RU student ID?"
        - "My college card is broken, what do I do?"

      DECISION LOGIC (STUDENT CARD)
      - Treat these as factual campus service questions and route them to
        other_facilities_flow so enterprise search can be used on the
        administrative/service docs.
      - Do NOT route these messages to mental_health_light_flow or mental_health_severe_flow,
        even if the user sounds upset or frustrated.
      - The answer should point to the Central Student Desk in the Berchmanianum
        when this is documented in the campus information.

      OTHER FACILITIES (IF NEEDED)

      - General non-food, non-prayer, non-event facilities described
        in the docs can also be handled here when no other thematic
        flow fits better.

      DECISION LOGIC

      - If the main focus is childcare / daycare / Kinderopvang:
        → use other_facilities_flow.
        - For time-only questions ("when is it open?") you may still
          prefer opening_hours_flow, but other_facilities_flow can
          answer with whatever is in the docs.
      - If the main focus is parking, parking garages, or where to park
        for a building:
        → use other_facilities_flow.
        - For purely time-focused parking questions ("Is P7b open
          24/7?"), opening_hours_flow is also acceptable, but
          other_facilities_flow is fine as it may mention context.
      - If the main focus is bike parking / bicycle sheds / fietsrekken
        / fietsenstalling:
        → other_facilities_flow.
      - If the question is about another facility that is neither food
        nor bar nor prayer room nor event space, but appears in the
        docs as a campus service:
        → other_facilities_flow.
      - If it clearly matches none of the thematic flows but is still
        campus factual:
        → pattern_search as final catch-all.

      EXAMPLES (→ other_facilities_flow)

      - "Where is Childcare Heyendael?"
      - "Is there daycare on campus?"
      - "Where can I park if I go to Gymnasion?"
      - "Is the parking garage by EOS 24/7?"
      - "Where can I park my bike at MM?"
      - "Is there a bike parking spot near the library?"

  study_spots_patterns:
    description: |
      This section describes how to recognise user questions about
      study places and quiet workspaces on campus, and map them to
      study_spots_flow instead of the more generic pattern_search.
      
      WHAT COUNTS AS A "STUDY SPOT" QUESTION
      
      Treat a message as study-spot-related when users:
      - Explicitly ask where they can study or work:
        - "Where can I study on campus?"
        - "I need a quiet place to study."
        - "Where can I work on my laptop near EOS?"
      - Mention "study places", "study spots", "study areas",
        "study spaces", "quiet zone" or similar:
        - "Where are the quiet study zones?"
        - "Is there a silent study area in Maria Montessori?"
      - Refer to typical study buildings:
        - the University Library (UB),
        - Maria Montessori study floors,
        - EOS study zones,
        - Huygens study areas,
        - Radboudumc Study Center, etc.,
        combined with language about studying or working.
      
      DECISION LOGIC
      
      - If the main purpose of the question is to find a place to
        study or work (quiet or group), choose study_spots_flow.
      - If the main purpose is to know WHEN such a place is open
        ("What are the UB opening hours on Sunday?"), prefer
        opening_hours_flow instead, even if the location is a
        study space.
      - If the main purpose is food or drinks ("Where can I get coffee
        near the library?"), prefer food_and_drink_flow.
      - If the question mixes topics, choose the flow that best matches
        the user's core goal (for example, if they say "I want to study
        and get coffee near MM", you may still use study_spots_flow and
        mention both study and coffee options as documented.
      
      EXAMPLES
      
      - "Where can I study near EOS?"
      - "Is there a quiet place to study in the library?"
      - "What are good study spots in Maria Montessori?"
      - "Can I study in Huygens if I am not a science student?"

  # ---------------------------------------------------------------------------
  # SMALLTALK & FALLBACK & MENTAL HEALTH SAFETY
  # ---------------------------------------------------------------------------

  fallback_patterns:
    description: |
      Start: fallback_flow

      Use fallback_flow only for input that is truly unclear or not answerable as a campus request,
      even after clarification attempts.

      Typical examples:
      - random keyboard noise / repeated nonsense strings
      - repeated unknown codes after the bot already said it cannot find them
      - clearly non-campus questions outside scope

      IMPORTANT: When NOT to use fallback_flow
      Do NOT send these to fallback_flow:
      - Mode-switch follow-ups after a route or fastest-route answer:
        "Can I go there cycling then?", "Ok by bike", "Same route but walking"
        -> mode_switch_flow
      - Short route follow-ups that still mean "give directions":
        "How do I get there?", "Show me the route"
        -> route_description_flow / travel_mode_clarification_flow
      - Campus questions that are just broadly phrased:
        -> pattern_search (not fallback)

  smalltalk_patterns:
    description: |
      This section explains how to recognise off-topic smalltalk and route
      it to smalltalk_flow (or, when triggered by Rasa repair logic,
      to pattern_chitchat).
  
      WHAT COUNTS AS SMALLTALK:
      - Short emotional reactions without a campus task:
        - "lol", "haha", "hahaha", "omg", "wow", "nice", "cool"
        - "you are funny", "love this bot", "you are great"
      - Light social questions or remarks not tied to campus:
        - "how is your day?", "what is your favourite color?"
        - "tell me something random", "tell me a joke"
      - Meta comments about the conversation:
        - "this is weird", "you are surprisingly helpful", "ok cool 👍"
  
      IMPORTANT: WHAT IS NOT SMALLTALK (keyboard smashes / noise)
      - Random character sequences, repeated letters, or "keyboard smash"
        messages are NOT smalltalk, even if they look playful.
        Examples:
        - "wieojfoiewhgoiewhg"
        - "asdfghjkl"
        - "HHHHHHHHHHHHHHHHH"
        - "!!!!!!!!!"
      - These must be routed to fallback_flow (unclear input), not smalltalk_flow.
  
      CONDITIONS FOR smalltalk_flow:
      - The message does NOT contain a concrete campus request:
        - no "where is X", "how do I get to Y", "when is Z open"
        - no building or room code like "MM 01.029", "EOS", "HG00.616"
        - no explicit abbreviation question ("what does EOS mean?")
      - The message is NOT primarily about identity:
        - pure "who are you" or "what can you do" goes to identity_flow.
  
      IMPORTANT NEGATIVE EXAMPLES (SHOULD NOT USE smalltalk_flow):
      - Mixed smalltalk + campus request:
        - "lol I am lost, how do I get to MM?"
        - "haha, where is EOS again?"
        → these must be routed to the relevant campus flow
          (e.g. abbreviation_flow, pattern_search), not smalltalk_flow.
      - Campus content disguised as a joke:
        - "haha, where can I get coffee near UB?"
        → still a food_and_drink_flow question.
      - Keyboard smashes / noise (see above):
        → fallback_flow.
  
      BEHAVIOUR:
      - For pure smalltalk, use smalltalk_flow:
        - first run action_smalltalk_llm for one short, friendly sentence
          that does NOT answer campus questions,
        - then utter_free_chitchat_response to remind the user the bot
          is for campus help.
      - When Rasa’s pattern_chitchat override is triggered instead,
        it should behave similarly but only send utter_free_chitchat_response.
  
      If the user continues with a concrete campus question after smalltalk,
      subsequent turns should use the normal content flows again.

  mental_health_patterns:
    description: |
      This section explains when to route a message to mental_health_severe_flow
      or mental_health_light_flow instead of normal campus flows.

      TREAT AS SEVERE MENTAL HEALTH / CRISIS WHEN:
      - The user talks about wanting to die, not wanting to live, or suicidal thoughts:
        - "I don't want to live anymore", "I want to end it", "I am suicidal".
      - The user mentions self-harm or harming themselves:
        - "I cut myself", "I want to hurt myself", "I hurt myself on purpose".
      - The user says they are in crisis or completely overwhelmed emotionally:
        - "I can't cope anymore", "everything is too much", "I am really not okay".
      - The message is mainly about very severe mental health problems, such as
        deep depression, intense anxiety, panic attacks, burnout, or feeling unsafe
        with themselves (for example: afraid they might hurt themselves).

      TREAT AS LIGHT / NON-CRISIS MENTAL HEALTH WHEN:
      - The user talks about feeling mentally unwell, but without clear crisis or self-harm signals:
        - feeling down, lonely, anxious, insecure, homesick, or low energy.
        - study stress, performance pressure, or feeling overwhelmed, but still coping.
        - "I am not doing well mentally", "I feel really low", "I am struggling a lot",
          as long as they do NOT mention wanting to die or hurt themselves.
      - The main focus is emotional wellbeing, mood, or stress, but the situation does
        not seem immediately life-threatening.

      PRIORITY OVER OTHER FLOWS:
      - If there are clear suicidal, self-harm, or crisis signals, choose
        mental_health_severe_flow even when the user also talks about studies or campus,
        for example: "I am so done with my studies here, I want to end it".
      - If the message is mainly about feeling mentally bad or emotionally overloaded
        without self-harm or suicidal language, choose mental_health_light_flow.
      - Do NOT route these messages to smalltalk_flow, pattern_chitchat, or fallback_flow.
        Safety and signposting to real help always take priority over normal informational tasks.

      BEHAVIOUR EXPECTATIONS (BOTH FLOWS):
      - The assistant must NOT offer therapy, diagnoses, or detailed coping techniques.
      - It must clearly say that CampusCompass cannot support with mental health care or crises,
        and should encourage reaching out to real people.
      - For severe situations, it should mention:
        - 112 for immediate danger or emergencies.
        - 113 Suicide Prevention for suicidal thoughts (phone 113 or their website),
          given the Dutch context.
      - For both severe and light situations, it is helpful to gently encourage informing
        someone they trust (friend, family, GP, study advisor) and to add a compassionate line such as:
        "you do not have to go through this alone" and "I hope things will get better".

      If the message only mentions mild, everyday stress about studies or exams
      ("I am stressed about my exam", "this is a bit overwhelming") but no clear mental health
      or crisis language, then normal campus/help flows can be used instead of mental health flows.

      IMPORTANT NEGATIVE EXAMPLES (SHOULD NOT USE MENTAL HEALTH FLOWS):
        - Pure frustration or disagreement with the bot, e.g.:
            - "Yes you do"
            - "wtf, you do know this"
            - "this is really annoying"
        - Practical problems like:
            - lost student card, exam registration issues, timetable confusion,
              housing, or money problems,
          UNLESS the user explicitly says they want to die or harm themselves
          or clearly talks about being in mental crisis.
        - These cases should go to normal campus flows (pattern_search, other_facilities_flow,
          opening_hours_flow, etc.), not to mental_health_light_flow or mental_health_severe_flow.

  # ---------------------------------------------------------------------------
  # DECLINE (DETERMINISTIC)
  # ---------------------------------------------------------------------------
  decline_help_patterns:
    description: |
      Start: decline_help_flow

      Use this when the user politely declines further help and is essentially done,
      usually as a direct response to "Is there anything else I can help you with?".

      Typical examples:
      - "not really"
      - "no"
      - "nope"
      - "nah"
      - "nothing else"
      - "that's all"
      - "all good"
      - "I'm good"
      - "no thanks"

      Decision rules (IMPORTANT):
      - Use this only when the message is a pure decline / closing signal.
      - If the message contains ANY new campus request or question, do NOT use this.
        Examples that must NOT go here:
        - "not really, but where is EOS?"
        - "no, how do I get to MM?"
        - "nah — what are the opening hours?"
      - If the message is unclear noise/keyboard smash, use fallback_flow instead.
      - If the message is a clear goodbye ("bye", "doei"), prefer goodbye_flow.

      Behaviour:
      - Give one short, polite closing line.
      - Do NOT ask follow-up questions.
      - End immediately.
