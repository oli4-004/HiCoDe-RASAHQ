version: "3.1"

patterns:

  # ---------------------------------------------------------------------------
  # BUILDINGS & ROOM CODES
  # ---------------------------------------------------------------------------

  building_and_room_code_patterns:
    description: |
      This section describes how Radboud University building abbreviations
      and room codes are structured, so the assistant can recognize them
      and map them to the correct flow.

      The main distinction is:

      - abbreviation_flow:
        For questions like "what does this code mean / stand for?"
        or "what building is this code?".
      - Thematic flows (food_and_drink_flow, opening_hours_flow,
        study_association_flow, etc.):
        For questions about facilities, food, study associations,
        prayer rooms, events, opening hours, etc. in or near a building.
      - pattern_search:
        Catch-all when a question is clearly about campus but does not
        strongly match any thematic flow.
      - fallback_flow:
        For random / unknown strings that clearly do not match campus
        building or room patterns.

      GENERAL PRINCIPLES

      - A "building or room code" is usually a short abbreviation (1–5
        letters) followed by optional numbers and dots, for example:
        "MM", "MM 01.029", "SP A/B -1.55", "E.01.15", "GR 0.100".
      - When users mention such codes, they are typically asking either:
        - what building it refers to (→ abbreviation_flow), or
        - opening hours, facilities or locations for that building
          (→ one of the thematic search flows / pattern_search).
      - When the user writes a code like "MM 01.029", treat the whole
        string as the value for the abbreviation_raw slot.

      COLLEGEZAALENCENTRUM / COLLEGEZAALCOMPLEX

      - Name: Collegezalencomplex (Lecture Hall Complex)
      - Address: Mercatorpad 1
      - Abbreviation: CC
      - Example room codes:
        - CC1 t/m CC5 = lecture halls 1–5 on the ground floor.
      - Any code that starts with "CC" followed by a digit (for example
        "CC3") is a room in the Collegezalencomplex at Mercatorpad 1.

      SPINOZA BUILDING (SP)

      - Name: Spinozagebouw (Spinoza Building)
      - Address: Montessorilaan 3
      - Abbreviation: SP
      - Example codes:
        - SP1 t/m SP3 = lecture halls 1–3 on the ground floor.
        - SP A/B -1.55 = basement room 55 in wing A/B.
        - SP A 01.14 = wing A, 1st floor, room 14.
        - SP B.00.12 = wing B, ground floor, room 12.
      - If a code starts with "SP" optionally followed by a wing letter
        (A or B) and contains floor/room numbers, treat it as a Spinoza
        Building room code.

      MARIA MONTESSORI BUILDING (MM)

      - Name: Maria Montessori Building
      - Address: Thomas van Aquinostraat 4
      - Abbreviation: MM
      - Wing rules:
        - MM 1–199 = blue wing.
        - MM 200–299 = bridge with Grand Café de Iris.
        - MM 300 and higher = green wing.
      - Even room numbers are on the window side.
      - Odd room numbers are on the atrium side.
      - Example code:
        - MM 01.029 = blue wing, 1st floor, room 29.
      - Any code starting with "MM" followed by a floor/room pattern
        like "MM 01.029" or "MM 02.123" is a Maria Montessori room.

      THOMAS VAN AQUINOSTRAAT (TvA)

      - Name: Thomas van Aquinostraat buildings
      - Street: Thomas van Aquinostraat
      - Abbreviation: TvA
      - Example room codes:
        - TvA. 1.00.09 = Thomas van Aquinostraat 1, ground floor, room 9.
        - TvA. 2.03.06 = Thomas van Aquinostraat 2, 3rd floor, room 6.
      - When you see "TvA." followed by building number, floor and room
        segments separated by dots, treat it as a Thomas van Aquinostraat
        room code.

      ERASMUS BUILDING (E)

      - Name: Erasmusgebouw (Erasmus Building)
      - Address: Erasmusplein 1
      - Abbreviation: E
      - Example codes:
        - E.01.15 = 1st floor, room 15.
        - E.2.50 = low-rise section, room 2.50.
      - Codes starting with "E." followed by floor/room segments belong
        to the Erasmus Building.

      GYMNASION / SPORTS CENTRE (GYM / GN / RSC)

      - Names and abbreviations:
        - Gymnasion (sports building): GYM or GN
        - Sports Centre: RSC
        - Shared address: Heyendaalseweg 141
      - GN room patterns:
        - GN 1–3 = ground floor rooms 1–3.
        - GN 4–7 = 1st floor rooms 4–7.
      - Z 01.240 in this context refers to a 1st floor room
        (Z 01.240 = 1st floor).
      - Sports centre codes:
        - Sporthallen Hal 1 and Hal 2 are often used for exams.
      - When you see "GN" followed by a small number, treat it as a
        Gymnasion room code at Heyendaalseweg 141.
        When you see RSC + hall number, treat it as a Sports Centre space.

      GROTIUS BUILDING (GR)

      - Name: Grotiusgebouw (Grotius Building)
      - Address: Montessorilaan 10
      - Abbreviation: GR
      - Example codes:
        - GR 0.100 = large lecture hall on the ground floor.
        - GR 01.175 = 1st floor, room 175.
        - GR -01.175 = one level below the ground floor, room 175.
      - Any code starting with "GR" followed by floor/room numbers is a
        Grotius room code.

      LINNAEUS BUILDING (LIN)

      - Name: Linnaeusgebouw (Linnaeus Building)
      - Address: Heyendaalseweg 137
      - Abbreviation: LIN
      - LIN 1–8 refers to lecture halls 1–8 in the Linnaeus Building.
      - Any code starting with "LIN" followed by a small number refers
        to a Linnaeus lecture hall.

      ELN ROOMS (ELN)

      - Address: Erasmuslaan 9
      - Abbreviation: ELN
      - Example codes:
        - ELN9-Aula = Aula on the ground floor.
        - ELN9-lokaal 2 = room 2 on the ground floor.
        - ELN LOK 01.23 = room 23, 1st floor.
      - Any code starting with "ELN" or "ELN9" refers to a room in the
        Erasmuslaan 9 building.

      ELINOR OSTROM BUILDING (EOS)

      - Name: Elinor Ostrom Building
      - Address: Heyendaalseweg 141 (near the University Library and
        Gymnasion)
      - Abbreviation: EOS
      - Typical room code:
        - EOS 01.110 = 1st floor, room 110.
      - EOS is often used in schedules as a building code by itself.

      COMENIUS BUILDINGS (COMA / COMB)

      - Names: Comenius Building A and Comenius Building B
      - Common informal abbreviations:
        - COMA -> Comenius Building A
        - COMB -> Comenius Building B
      - When the user types COMA or COMB in a timetable context, treat
        it as a building abbreviation referring to Comenius A or B.

      OTHER COMMON BUILDINGS AND NAMES

      The campus also contains buildings and facilities such as:
      - Aula (ceremonial hall)
      - Berchmanianum
      - Huygens Building (often abbreviated as HG in timetables)
      - University Library (UB)
      - De Refter (central restaurant, Erasmus low-rise)
      - Grand Café de Iris (in Maria Montessori)
      - Various food and non-alcoholic drink locations, bars and cafés
        around the Erasmus and Huygens zones.

      Even if a building does not follow a strict abbreviation pattern,
      treat any of the names above as campus buildings or facilities.

      DECISION LOGIC FOR BUILDING / ROOM PATTERNS

      - If the user message contains a string that matches one of the
        abbreviation patterns above (MM, SP, CC, GR, LIN, E, GN, EOS,
        TvA, COMA, COMB, ELN, HG, etc.), it is likely a building or room
        code:

        1) If they ask "what is this?" / "what does this code mean?" /
           "what building is that?":
           → use abbreviation_flow and fill abbreviation_raw with the code.

        2) If they ask about:
           - where the building is,
           - what is inside,
           - food or coffee there,
           - study associations there,
           - prayer rooms there,
           - events there,
           - opening hours of that building or a facility inside it,
           → use the corresponding thematic flow:
             - food_and_drink_flow for food / non-alcoholic drinks,
             - alcohol_and_bar_flow for alcohol / borrels,
             - study_association_flow for study associations,
             - umbrella_association_flow for umbrella organisations,
             - prayer_room_flow for prayer / quiet rooms,
             - event_and_activity_flow for venues / events,
             - public_transport_flow for "which station/bus for X",
             - opening_hours_flow when time/open/close is the main focus,
             - other_facilities_flow for childcare, parking and similar.
           If none fits clearly, fall back to pattern_search.

      - If the user sends short random strings that do NOT match any of
        the patterns above, treat them as unclear input and prefer
        fallback_flow over abbreviation_flow.

  # ---------------------------------------------------------------------------
  # FOOD, DRINKS & SOCIAL SPACES
  # ---------------------------------------------------------------------------

  food_and_drink_patterns:
    description: |
      This section describes how to recognise user questions about food,
      drinks and non-alcoholic cafés/restaurants on and around Radboud
      campus, and how to route them.

      WHAT COUNTS AS A "FOOD / DRINK" QUESTION

      Treat a user utterance as a food/drink question when:
      - They ask where to eat or drink on campus, for example:
        - "Where can I get lunch on campus?"
        - "Where can I drink coffee near EOS?"
        - "Is there food inside MM?"
        - "Where can I get a snack between lectures?"
      - They mention a specific venue like:
        - De Refter, Cultuurcafé, Grand Café de Iris, Blommers (EOS/HG),
          Coffee Corner UB, Giga-Bite, Het Gerecht, The Yard, the
          Radboudumc restaurant, etc.
      - They ask about typical food, drinks or vibe of such places:
        - "What do they sell in De Refter?"
        - "Is Cultuurcafé a bar or just a café?"
        - "Is there vegetarian food at the campus restaurant?"
        - "Where can I get good coffee near the library?"

      DECISION LOGIC

      - If the main focus is FOOD / NON-ALCOHOLIC DRINKS:
        → use food_and_drink_flow.
        Examples:
        - "Is there a café in EOS?"
        - "Where can I have lunch near Huygens?"
        - "What is De Refter?"
      - If the main focus is ALCOHOL / BORRELS:
        → use alcohol_and_bar_flow instead (see below).
      - If the main focus is OPENING HOURS of a food venue
        ("What time does De Refter close on Thursday?"):
        → prefer opening_hours_flow; the answer can still mention
          the type of venue.
      - If the question mixes food with broader description
        ("Tell me what is in MM, including food and study spaces"):
        → if it is mainly about food → food_and_drink_flow;
          otherwise → pattern_search.

      EXAMPLES (→ food_and_drink_flow)

      - "Where can I eat near GR?"
      - "Is there a coffee bar in EOS?"
      - "Where can I get a sandwich close to the UB?"
      - "What kind of place is Grand Café de Iris?"

  alcohol_and_bar_patterns:
    description: |
      This section covers questions about alcohol, bars and borrel
      locations on campus and how to route them.

      IMPORTANT CAMPUS RULE

      - Alcohol can only be served on campus after 15:30.

      WHAT COUNTS AS A "BAR / BORREL" QUESTION

      Treat a message as bar/borrel-related when users:
      - Ask explicitly about alcohol, beers, borrels, or (alcoholic)
        drinks:
        - "Where can I drink beer on campus?"
        - "Are there any student bars here?"
        - "Can I get a beer before my exam?"
      - Mention specific bar-type venues:
        - Cultuurcafé (particularly evenings),
          MFVN Café de Aesculaaf, TFV bar 't Dappenglaasje,
          The Yard, dentistry café/bar, etc.
      - Ask about where study associations organise borrels:
        - "Where are Huygens borrels?"
        - "Where does my association usually drink?"

      DECISION LOGIC

      - If the question is about ALCOHOL, BORRELS or STUDENT BARS:
        → use alcohol_and_bar_flow.
      - If they also mention opening hours ("When is Cultuurcafé open?")
        but alcohol/bars is still central:
        → alcohol_and_bar_flow; the answer can include hours if available.
      - If the question is mainly "when is this place open" with only a
        minor reference to alcohol:
        → opening_hours_flow may be acceptable, but alcohol_and_bar_flow
          is preferred if the bar nature is central.
      - If they ask whether a random room can serve alcohol or about
        association canteens used as bar in Huygens:
        → alcohol_and_bar_flow.

      EXAMPLES (→ alcohol_and_bar_flow)

      - "Where is Café de Aesculaaf?"
      - "What time does 't Dappenglaasje open?"
      - "Are there any campus pubs apart from Cultuurcafé?"
      - "Can I drink alcohol in the afternoon in MM?"

  # ---------------------------------------------------------------------------
  # ASSOCIATIONS, UMBRELLAS, EVENTS, PRAYER ROOMS
  # ---------------------------------------------------------------------------

  study_association_patterns:
    description: |
      This section explains how to recognise questions about faculty
      or study associations and route them correctly.

      WHAT COUNTS AS A "STUDY ASSOCIATION" QUESTION

      Treat a message as study-association-related when users:
      - Ask about specific study associations:
        - "Where is Mundus located?"
        - "Where is ismus / Common Ground?"
        - "Where is the study association for dentistry?"
      - Ask about "study association rooms", "association floor",
        "association corridor", or "board room".
      - Ask generally:
        - "Where can I find my study association?"
        - "Which building are the law associations in?"
        - "Where is the association cluster in EOS?"

      DECISION LOGIC

      - If the main focus is LOCATION / ROOM / BUILDING of study
        associations or their hang-out spaces:
        → use study_association_flow.
      - If they ask where associations organise BORRELS or EVENTS:
        - For bar-like events → alcohol_and_bar_flow.
        - For general event spaces (Theaterzaal C, Aula, etc.) → 
          event_and_activity_flow.
      - If they ask "What is a study association?" in a generic way
        without referencing specific campus docs:
        - The LLM may answer briefly without using search, but
        - study_association_flow is still a reasonable choice to keep
          behaviour consistent.

      EXAMPLES (→ study_association_flow)

      - "Where is the ismus board room in EOS?"
      - "What is Common Ground in Maria Montessori?"
      - "Where are the law associations located?"

  umbrella_association_patterns:
    description: |
      This section covers questions about umbrella ("koepel")
      organisations and student platforms on campus.

      WHAT COUNTS AS AN "UMBRELLA ASSOCIATION" QUESTION

      Treat it as an umbrella/koepel question when:
      - Users explicitly mention CSN, BOS, SOFv, CODC, NSSR, VOS or
        similar umbrella acronyms.
      - They ask "Where are the umbrella associations located?" or
        "What is SOFv?" or "Where is the student union AKKU?".
      - They talk about "De Ondergang" as a cluster of student
        organisations in the EOS basement.

      DECISION LOGIC

      - Location and description of umbrella associations (often in
        the Ondergang in EOS) is factual campus info:
        → use umbrella_association_flow.
      - If they ask "What does SOFv stand for?" or "What is CODC?",
        this is still campus-specific abbreviation + role information:
        → umbrella_association_flow.
      - If they mention random acronyms with no match in the knowledge
        base, prefer:
        → fallback_flow, not guessing.

      EXAMPLES (→ umbrella_association_flow)

      - "Where is SOFv located?"
      - "What is CODC?"
      - "Is NSSR an umbrella or a normal association?"
      - "Where are the umbrella organisations in EOS?"

  prayer_room_patterns:
    description: |
      This section explains how to handle questions about prayer rooms,
      quiet rooms, reflection spaces and similar facilities, and map
      them to the right flow.

      WHAT COUNTS AS A "PRAYER / REFLECTION ROOM" QUESTION

      Treat an utterance as prayer-room-related when:
      - Users explicitly say "prayer room", "quiet room", "reflection
        room", "meditation space", etc.:
        - "Is there a prayer room on campus?"
        - "Where can I pray as a Muslim student?"
        - "Is there a quiet room in the library?"
      - They mention concrete locations from the knowledge base:
        - Student Church, UB reflection room (UB-1.02), Transitorium
          prayer room, Radboudumc quiet room, MSV room in the Ondergang
          (EOS).

      DECISION LOGIC

      - If the focus is the LOCATION / AVAILABILITY / TYPE of prayer
        room or reflection space:
        → use prayer_room_flow.
      - If the focus is specifically OPENING HOURS:
        → opening_hours_flow is acceptable, but prayer_room_flow may
          still answer and mention hours if docs include them.
      - If they ask conceptual/theological questions ("how should I
        pray", "which religion is this room for"):
        - That is not pure campus-facts; answer briefly and carefully,
        - but prayer_room_flow can still be used because the facilities
          are campus-based.

      EXAMPLES (→ prayer_room_flow)

      - "Where is the prayer room in the library?"
      - "Does Radboud have separate prayer rooms for men and women?"
      - "Is there a 24/7 quiet room on campus?"

  event_and_activity_patterns:
    description: |
      This section describes how to recognise questions about event
      venues, performance spaces, and frequent activity locations.

      WHAT COUNTS AS AN "EVENT / ACTIVITY" QUESTION

      Treat it as event-related when users:
      - Mention event venues:
        - Theaterzaal C, Aula, Berchmanianum, Huize Heyendael.
      - Mention campus social/event spaces:
        - De Ondergang (EOS), Common Ground (MM), Huygens canteens
          used for events, association borrel spaces.
      - Ask where an event is when a room/building/venue name is given:
        - "My schedule says Theaterzaal C; where is that?"
        - "Where is the Aula for my graduation?"
      - Ask "Where do study associations usually organise activities?"

      DECISION LOGIC

      - If they ask *where* the event space is or what it is used for:
        → use event_and_activity_flow.
      - If they ask "what kind of events happen in X", this is still
        factual campus context:
        → event_and_activity_flow.
      - If they ask about booking/reservations ("Can I book the Aula?"):
        - Start from event_and_activity_flow and answer based on
          official descriptions if available; otherwise mention that
          booking goes via university channels and avoid inventing rules.

      EXAMPLES (→ event_and_activity_flow)

      - "Where is Theaterzaal C?"
      - "What is De Ondergang in EOS?"
      - "Where is the Aula for graduation ceremonies?"
      - "Where do associations organise larger events?"

    # ---------------------------------------------------------------------------
  # TRANSPORT & ROUTES (WALK / BIKE / PUBLIC TRANSPORT)
  # ---------------------------------------------------------------------------

  route_patterns:
    description: |
      Detect when the user is asking how to get from one campus place to another,
      or how long it takes to travel between two places on or around campus.

      INTENTS:
      - Use the intent ask_route_description when the user mainly wants directions
        in words between two locations (for example "How do I get from A to B?").
      - Use the intent ask_travel_time when the user mainly wants to know how long
        it takes (walking/bus/bike/car) between two locations.

      HIGH-LEVEL DECISION:
      - If the user clearly talks about WALKING or CYCLING, and mentions campus
        buildings/places, treat it as an on-campus route:
        → use ask_route_description and route_description_flow.
      - If the user clearly talks about PUBLIC TRANSPORT (train, bus, OV, station,
        stop, line numbers, etc.), treat it as an OV question:
        → use public_transport_flow.
      - If the user mentions buildings/places but does NOT clearly specify
        walking/cycling or public transport ("How do I get to EOS?"):
        → start travel_mode_clarification_flow first, so the assistant can ask
          whether they prefer walking/cycling or OV.

      RAW BUILDING SLOTS:
      - source_building_raw and target_building_raw:
        These store the raw building references exactly as the user phrases them,
        for example "HG", "COM B", "tandheelkunde", "the library", "MM", "EOS".
      - These raw slots are later read by a custom action (action_get_route_description),
        which internally normalizes them using the building documentation and the LLM.
        The patterns do NOT need to worry about canonical names or external APIs.

      STRICT RULES FOR RAW SLOTS:
      - The slots source_building_raw and target_building_raw MUST ONLY contain
        building names that the user explicitly mentioned in their own words
        (in the current or previous user messages).
      - Do NOT invent or guess extra buildings, bus stops or locations based on
        your knowledge base. For example, do NOT set target_building_raw to
        "Erasmus building" just because you know that is the nearest bus stop for
        EOS, if the user never wrote "Erasmus".
      - If the user does not mention a starting point at all (e.g. "How do I
        get to EOS?"), only fill target_building_raw = "EOS" and leave
        source_building_raw empty so the flow can ask where the user is now.
      - If the user does NOT explicitly name their starting building, you MUST
        leave source_building_raw empty. Do NOT invent values like "here",
        "my location", "your location", "current location", or "user_location"
        for any building slot.

      BUILDING NAMES AND CODES:
      - Treat Radboud building names and codes as 'building', for example:
        Comenius, Comenius A, Comenius B, COM, COM A, COM B, CC, Collegezalencomplex,
        Erasmus, Erasmus building, Huygens, HG, Maria Montessori, MM, Dentistry,
        Tandheelkunde, UB (University Library), EOS, etc.
      - The knowledge base contains documents describing these buildings and their
        abbreviations. Use entities to mark obvious building names and codes, but
        keep the slot values as close as possible to what the user wrote.
      - If you are unsure, still try to map obvious campus building names to the
        building entity and to the appropriate slots, without inventing new names.

      FLOW BEHAVIOUR (route_description_flow):
      1) First, the flow collects source_building_raw and target_building_raw.
         - If the user mentions both buildings in the same message,
           you should extract them directly into these raw slots and avoid
           asking a follow-up question.
           Example:
             "I really need to go to COM for an exam but I'm still at Erasmus"
             => source_building_raw = "Erasmus", target_building_raw = "COM".
         - If only one building is given (for example "How do I get to COM?"),
           fill target_building_raw = "COM" and leave source_building_raw empty,
           so the flow can ask where the user is now.
         - If the user only mentions the source ("I'm at MM, how can I get there later?"),
           set source_building_raw = "MM" and keep target_building_raw empty so the flow
           can ask for the destination.

      2) After the raw slots are filled, the flow calls action_get_route_description.
         - This custom action:
           - reads source_building_raw and target_building_raw,
           - normalizes them with the building documentation and an LLM,
           - calls an internal routing API (Google Maps) for walking directions,
           - and returns a short, readable explanation to the user.
         - The patterns do NOT need to perform any extra search or normalization.

      DECIDING SOURCE VS TARGET:
      - For phrases like "from A to B":
        source_building_raw = A, target_building_raw = B.
      - For phrases like "to B but I'm (still) at A":
        target_building_raw = B, source_building_raw = A.
        Example: "I really need to go to COM for an exam but I'm still at Erasmus"
        => source_building_raw = "Erasmus", target_building_raw = "COM".
      - For "back to A" / "return to A":
        - If there was a previous route from A to B in this conversation, then a follow-up
          "How do I get back to A?" should swap the buildings:
          source_building_raw = previous target, target_building_raw = previous source.

      FOUR COMMON PHRASING CASES:
      1) The outward trip is mentioned explicitly:
         - "from A to B"
         => source_building_raw = A, target_building_raw = B.
      2) Only the source is mentioned:
         - "I'm at A and I have an exam later, how can I get there?"
         => source_building_raw = A, target_building_raw = "" (empty).
      3) Only the destination is mentioned:
         - "How do I get to EOS?"
         => target_building_raw = "EOS", source_building_raw = "" (empty).
         NEVER invent a fake origin such as "my location" or "user_location".
      4) No buildings are repeated, but the user refers to a previous route:
         - If the user says "And how do I get back?" after a route from A to B,
           reuse the previous buildings, swap them, and set
           source_building_raw = previous target, target_building_raw = previous source.
         - The "previous" buildings are stored in the slots
           prev_source_building_raw and prev_target_building_raw by the custom
           action action_clear_route_context, so later turns like
           "How do I get back?" can still access them.

      If you cannot clearly decide, still set the buildings based on the most
      likely reading of the user's message, but never fabricate buildings that
      were not mentioned.

      WHEN NOT TO USE ROUTE_DESCRIPTION_FLOW:
      - If the question is primarily about public transport lines or which
        bus/train to take to campus, prefer public_transport_flow.
      - If the user is only asking for opening hours or what is inside
        a building, use the existing thematic flows or pattern_search instead.

      SLOT SETTING EXPECTATIONS:
      - For every route or travel-time request, fill:
        - source_building_raw and target_building_raw from the user's wording.
        - travel_mode_hint (see below), based ONLY on what the user actually says.
      - These slots may already be partially filled by travel_mode_clarification_flow;
        reuse existing values instead of asking again when possible.

      TRAVEL MODE HINT:
      - Always set the slot travel_mode_hint to the user's preferred mode if they clearly mention it:
        - Words like "on foot", "by foot", "walking", "walk" → travel_mode_hint = "walk".
        - Words like "by bike", "bicycle", "cycling", "fiets" → travel_mode_hint = "bike".
        - Words like "public transport", "bus", "train", "OV", "NS", "Arriva",
          "station", "bus stop" → travel_mode_hint = "public_transport".
      - If the user only mentions campus buildings and does NOT mention any mode
        (no walking/cycling words and no OV words, e.g. "How do I get to EOS?"),
        you MUST set travel_mode_hint = "unknown" and prefer
        travel_mode_clarification_flow to ask the user for their preference.
      - If you really cannot tell the mode from the wording, set travel_mode_hint = "unknown".

  travel_mode_clarification_patterns:
    description: |
      This section explains when to use **travel_mode_clarification_flow** to
      ask the user whether they want to WALK/CYCLE or use PUBLIC TRANSPORT.

      WHEN TO USE THIS FLOW:
      - The user asks how to get to or from one or more campus buildings,
        but does NOT clearly specify a travel mode.
        Examples:
        - "How do I get to EOS?"
        - "How do I get from MM to Huygens?"
        - "What is the best way to go from GR to EOS?"
      - In these cases, you MUST NOT guess the mode (walk vs OV).
        Instead, start travel_mode_clarification_flow so the assistant can ask:
        "Do you want to walk, cycle, or use public transport (bus/train)?"

      SLOT BEHAVIOUR:
      - Before asking about the travel mode, this flow should silently fill
        source_building_raw and target_building_raw from the current user
        message wherever possible (no extra questions).
      - Then the flow collects the travel_mode_hint slot explicitly.
      - The user’s answer (e.g. "by foot", "by bike", "by bus") should update:
        - travel_mode_hint = "walk" / "bike" / "public_transport" as appropriate.
      - After this flow ends, a short follow-up like "by foot" or "by bus"
        will allow the next turn to go directly to:
        - route_description_flow when travel_mode_hint is "walk" or "bike".
        - public_transport_flow when travel_mode_hint is "public_transport".

      RELATION TO OTHER FLOWS:
      - If the user already clearly specified a mode in the original question
        ("How do I walk from MM to Huygens?", "Which bus to EOS?"), do NOT use
        travel_mode_clarification_flow; go directly to the matching flow.
      - If the user changes their mind, for example:
        - First: "Which bus should I take to EOS?" → public_transport_flow.
        - Then: "I mean by foot." → treat the new message as a fresh query:
          travel_mode_hint = "walk" and use route_description_flow.

  public_transport_patterns:
    description: |
      This section describes how to recognise questions about public
      transport (OV) to, from and around campus and map them to the
      appropriate flow.

      WHAT COUNTS AS A "PUBLIC TRANSPORT" QUESTION

      Treat an utterance as public-transport-related when users:
      - Explicitly talk about trains, buses, trams, OV, NS, Arriva:
        - "How do I get to campus by train?"
        - "Which bus should I take to EOS?"
        - "Is there a bus stop near the UB?"
      - Mention stations and stops:
        - Nijmegen Centraal, Nijmegen Heyendaal, Heyendaalseweg stop,
          Huygens building bus stop, UMC bus stop, etc.
      - Ask how to get from a station to a campus building:
        - "How do I get from Nijmegen Central to Huygens?"
        - "What is the nearest station for Grotius?"
      - Ask explicitly for "public transport" or "OV" without naming
        trains or buses individually.

      DECISION LOGIC AND PRIORITY:

      - If the main focus is WHICH STATION / STOP / GENERAL OV ROUTE:
        → use public_transport_flow.
      - You should ONLY choose public_transport_flow when the user
        explicitly mentions public transport concepts such as:
        - train, bus, tram, OV, NS, Arriva,
        - station, stop, bus stop, platform, line/route numbers,
        - "public transport" or "OV".
      - If the user only says "How do I get to <building>?" or
        "How do I get from <building A> to <building B>?" without any
        explicit public transport words, do NOT guess OV:
        → prefer travel_mode_clarification_flow first, then route_description_flow
          or public_transport_flow once travel_mode_hint is known.
      - Do NOT use this flow for detailed walking directions between
        two campus buildings (e.g. "How do I walk from MM to Huygens?").
        Those should be handled by route_description_flow.

      TRAVEL MODE HINT FOR PUBLIC TRANSPORT:

      - Whenever you decide that public_transport_flow is appropriate,
        you MUST set travel_mode_hint = "public_transport".
      - Example mappings:
        - "Which bus should I take to EOS?" → travel_mode_hint = "public_transport".
        - "How do I get from Nijmegen Centraal to Huygens by train?"
          → travel_mode_hint = "public_transport".
      - If the user later corrects themselves with something like
        "I mean by foot" or "I want to walk", the new message should
        update travel_mode_hint to "walk" and be routed to
        route_description_flow instead.

      RELATION TO ROUTE DESCRIPTION:

      - Mixed questions can happen, for example:
        - "How do I get from Nijmegen Central to EOS and then walk to MM?"
      - In such cases, choose the flow that best matches the *first or main*
        request in the user's message:
        - If they primarily talk about the train/bus part, prefer public_transport_flow.
        - If they primarily talk about the on-campus walking part, prefer
          route_description_flow (possibly after travel_mode_clarification_flow).
      - The assistant must not give live departure times or delays,
        only general routes and typical stops as described in the docs.

      STATE CLEANUP:
      - After public_transport_flow has answered, the custom action
        action_clear_route_context resets travel_mode_hint to "unknown"
        and clears source_building_raw and target_building_raw, so later
        messages start from a fresh route context.

      EXAMPLES (→ public_transport_flow)

      - "Which station is closest to Huygens?"
      - "Is there a bus stop near the University Library?"
      - "How do I get from Nijmegen Central to campus?"
      - "Which bus line should I take to EOS?"
      - "What OV should I use to get from the city centre to MM?"

  # ---------------------------------------------------------------------------
  # OPENING HOURS, OTHER FACILITIES, STUDY SPOTS
  # ---------------------------------------------------------------------------

  opening_hours_patterns:
    description: |
      This section describes how to recognise generic opening-hours
      questions for buildings, services and venues and map them to
      opening_hours_flow.

      WHEN TO TREAT A QUESTION AS "OPENING HOURS"

      - The user explicitly mentions time, opening, closing:
        - "What time does the library close today?"
        - "Is EOS open on Saturday?"
        - "Until what time is De Refter open on Thursday?"
      - They combine a building or venue with words like "open",
        "close", "opening hours", "when":
        - "Is the prayer room open in the evening?"
        - "Is the parking garage by Gymnasion 24/7?"
      - They ask whether a facility is accessible on weekends, at night
        or during exams:
        - "Is the UB open on Sunday?"
        - "Does the MM building stay open in the evening?"

      DECISION LOGIC

      - If the main intent is to know WHEN it is open or closed:
        → use opening_hours_flow, regardless of whether the facility
          is a building, library, food venue, prayer room, parking
          garage, childcare, etc.
      - If the question is primarily about what the place IS or does
        with only a minor time remark ("what is De Refter and when is
        it open?"):
        - You may still use opening_hours_flow and give a short
          combined answer,
        - or use the relevant thematic flow (food_and_drink_flow,
          prayer_room_flow, other_facilities_flow) if the "what is it"
          aspect is stronger.
      - If no exact hours are known, say so clearly instead of
        inventing times.

      EXAMPLES (→ opening_hours_flow)

      - "Is P7b open at night?"
      - "When is Childcare Heyendael open?"
      - "What are the UB opening hours on Sunday?"
      - "How long is EOS open on Fridays?"

  other_facilities_patterns:
    description: |
      This section groups "other" campus facilities such as childcare,
      parking garages, and some general building facilities that are
      not purely food/drink, abbreviations, or prayer rooms.

      CHILDCARE / DAYCARE (KINDEROPVANG HEYENDAEL)

      - If the user mentions "childcare", "daycare", "Kinderopvang
        Heyendael", "Kinderdagverblijf", "campus daycare", or
        "KDV Heyendael", treat this as a childcare facility question.
      - Typical questions:
        - "Where is the daycare on campus?"
        - "Is there childcare on campus?"
        - "Is the daycare only for staff children?"
        - "How does Childcare Heyendael work?"

      PARKING GARAGES / MOBILITY

      - If the user mentions parking garages such as P7b (Gymnasion
        garage), Grotius or Huygens garages, or asks:
        - "Where can I park for EOS / Gymnasion / Huygens / GR?"
        - "Is the parking garage near Gymnasion 24/7?"
        - "How high is the parking garage by EOS?"
      - These are parking / mobility questions, not route directions:
        they are about where to park and what conditions apply.

      BICYCLES / BIKE PARKING

      - If the user mentions "bike parking", "bicycle shed", "fiets",
        "fiets parkeren", "fietsenstalling", "bike racks", "fietsrekken",
        or similar:
        - treat this as part of other_facilities_flow.
      - Typical examples:
        - "Where can I park my bike at MM?"
        - "Is there a bicycle parking near the library?"
        - "Where is the fietsenstalling by Huygens?"
        - "Can I lock my bike somewhere near EOS?"

      OTHER FACILITIES (IF NEEDED)

      - General non-food, non-prayer, non-event facilities described
        in the docs can also be handled here when no other thematic
        flow fits better.

      DECISION LOGIC

      - If the main focus is childcare / daycare / Kinderopvang:
        → use other_facilities_flow.
        - For time-only questions ("when is it open?") you may still
          prefer opening_hours_flow, but other_facilities_flow can
          answer with whatever is in the docs.
      - If the main focus is parking, parking garages, or where to park
        for a building:
        → use other_facilities_flow.
        - For purely time-focused parking questions ("Is P7b open
          24/7?"), opening_hours_flow is also acceptable, but
          other_facilities_flow is fine as it may mention context.
      - If the main focus is bike parking / bicycle sheds / fietsrekken
        / fietsenstalling:
        → other_facilities_flow.
      - If the question is about another facility that is neither food
        nor bar nor prayer room nor event space, but appears in the
        docs as a campus service:
        → other_facilities_flow.
      - If it clearly matches none of the thematic flows but is still
        campus factual:
        → pattern_search as final catch-all.

      EXAMPLES (→ other_facilities_flow)

      - "Where is Childcare Heyendael?"
      - "Is there daycare on campus?"
      - "Where can I park if I go to Gymnasion?"
      - "Is the parking garage by EOS 24/7?"
      - "Where can I park my bike at MM?"
      - "Is there a bike parking spot near the library?"

  study_spots_patterns:
    description: |
      This section describes how to recognise user questions about
      study places and quiet workspaces on campus, and map them to
      study_spots_flow instead of the more generic pattern_search.
      
      WHAT COUNTS AS A "STUDY SPOT" QUESTION
      
      Treat a message as study-spot-related when users:
      - Explicitly ask where they can study or work:
        - "Where can I study on campus?"
        - "I need a quiet place to study."
        - "Where can I work on my laptop near EOS?"
      - Mention "study places", "study spots", "study areas",
        "study spaces", "quiet zone" or similar:
        - "Where are the quiet study zones?"
        - "Is there a silent study area in Maria Montessori?"
      - Refer to typical study buildings:
        - the University Library (UB),
        - Maria Montessori study floors,
        - EOS study zones,
        - Huygens study areas,
        - Radboudumc Study Center, etc.,
        combined with language about studying or working.
      
      DECISION LOGIC
      
      - If the main purpose of the question is to find a place to
        study or work (quiet or group), choose study_spots_flow.
      - If the main purpose is to know WHEN such a place is open
        ("What are the UB opening hours on Sunday?"), prefer
        opening_hours_flow instead, even if the location is a
        study space.
      - If the main purpose is food or drinks ("Where can I get coffee
        near the library?"), prefer food_and_drink_flow.
      - If the question mixes topics, choose the flow that best matches
        the user's core goal (for example, if they say "I want to study
        and get coffee near MM", you may still use study_spots_flow and
        mention both study and coffee options as documented.
      
      EXAMPLES
      
      - "Where can I study near EOS?"
      - "Is there a quiet place to study in the library?"
      - "What are good study spots in Maria Montessori?"
      - "Can I study in Huygens if I am not a science student?"

  # ---------------------------------------------------------------------------
  # SMALLTALK & MENTAL HEALTH SAFETY
  # ---------------------------------------------------------------------------

  smalltalk_patterns:
    description: |
      This section explains how to recognise off-topic smalltalk and route
      it to smalltalk_flow (or, when triggered by Rasa repair logic,
      to pattern_chitchat).
      
      WHAT COUNTS AS SMALLTALK:
      - Short emotional reactions without a campus task:
        - "lol", "haha", "hahaha", "omg", "wow", "nice", "cool"
        - "you are funny", "love this bot", "you are great"
      - Light social questions or remarks not tied to campus:
        - "how is your day?", "what is your favourite color?"
        - "tell me something random", "tell me a joke"
      - Meta comments about the conversation:
        - "this is weird", "you are surprisingly helpful", "ok cool 👍"
      
      CONDITIONS FOR smalltalk_flow:
      - The message does NOT contain a concrete campus request:
        - no "where is X", "how do I get to Y", "when is Z open"
        - no building or room code like "MM 01.029", "EOS", "HG00.616"
        - no explicit abbreviation question ("what does EOS mean?")
      - The message is NOT primarily about identity:
        - pure "who are you" or "what can you do" goes to identity_flow.
      
      IMPORTANT NEGATIVE EXAMPLES (SHOULD NOT USE smalltalk_flow):
      - Mixed smalltalk + campus request:
        - "lol I am lost, how do I get to MM?"
        - "haha, where is EOS again?"
        → these must be routed to the relevant campus flow
          (e.g. abbreviation_flow, pattern_search), not smalltalk_flow.
      - Campus content disguised as a joke:
        - "haha, where can I get coffee near UB?"
        → still a food_and_drink_flow question.
      
      BEHAVIOUR:
      - For pure smalltalk, use smalltalk_flow:
        - first run action_smalltalk_llm for one short, friendly sentence
          that does NOT answer campus questions,
        - then utter_free_chitchat_response to remind the user the bot
          is for campus help.
      - When Rasa’s pattern_chitchat override is triggered instead,
        it should behave similarly but only send utter_free_chitchat_response.
      
      If the user continues with a concrete campus question after smalltalk,
      subsequent turns should use the normal content flows again.

  mental_health_patterns:
    description: |
      This section explains when to route a message to mental_health_severe_flow
      or mental_health_light_flow instead of normal campus flows.

      TREAT AS SEVERE MENTAL HEALTH / CRISIS WHEN:
      - The user talks about wanting to die, not wanting to live, or suicidal thoughts:
        - "I don't want to live anymore", "I want to end it", "I am suicidal".
      - The user mentions self-harm or harming themselves:
        - "I cut myself", "I want to hurt myself", "I hurt myself on purpose".
      - The user says they are in crisis or completely overwhelmed emotionally:
        - "I can't cope anymore", "everything is too much", "I am really not okay".
      - The message is mainly about very severe mental health problems, such as
        deep depression, intense anxiety, panic attacks, burnout, or feeling unsafe
        with themselves (for example: afraid they might hurt themselves).

      TREAT AS LIGHT / NON-CRISIS MENTAL HEALTH WHEN:
      - The user talks about feeling mentally unwell, but without clear crisis or self-harm signals:
        - feeling down, lonely, anxious, insecure, homesick, or low energy.
        - study stress, performance pressure, or feeling overwhelmed, but still coping.
        - "I am not doing well mentally", "I feel really low", "I am struggling a lot",
          as long as they do NOT mention wanting to die or hurt themselves.
      - The main focus is emotional wellbeing, mood, or stress, but the situation does
        not seem immediately life-threatening.

      PRIORITY OVER OTHER FLOWS:
      - If there are clear suicidal, self-harm, or crisis signals, choose
        mental_health_severe_flow even when the user also talks about studies or campus,
        for example: "I am so done with my studies here, I want to end it".
      - If the message is mainly about feeling mentally bad or emotionally overloaded
        without self-harm or suicidal language, choose mental_health_light_flow.
      - Do NOT route these messages to smalltalk_flow, pattern_chitchat, or fallback_flow.
        Safety and signposting to real help always take priority over normal informational tasks.

      BEHAVIOUR EXPECTATIONS (BOTH FLOWS):
      - The assistant must NOT offer therapy, diagnoses, or detailed coping techniques.
      - It must clearly say that CampusCompass cannot support with mental health care or crises,
        and should encourage reaching out to real people.
      - For severe situations, it should mention:
        - 112 for immediate danger or emergencies.
        - 113 Suicide Prevention for suicidal thoughts (phone 113 or their website),
          given the Dutch context.
      - For both severe and light situations, it is helpful to gently encourage informing
        someone they trust (friend, family, GP, study advisor) and to add a compassionate line such as:
        "you do not have to go through this alone" and "I hope things will get better".

      If the message only mentions mild, everyday stress about studies or exams
      ("I am stressed about my exam", "this is a bit overwhelming") but no clear mental health
      or crisis language, then normal campus/help flows can be used instead of mental health flows.
