<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Campus Compass</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --brand: #c70039; /* RU-ish accent */
      --text: #0f172a;
      --muted: #6b7280;
      --bot: #f1f5f9;   /* left bubble */
      --user: #1f2937;  /* right bubble */
      --user-text: #ffffff;
      --radius: 18px;
      --shadow: 0 10px 25px rgba(0,0,0,.06);
      --maxw: 480px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; padding: 24px; background: var(--bg); color: var(--text);
      font: 16px/1.45 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Noto Sans, Apple Color Emoji, Segoe UI Emoji;
      display: grid; place-items: start center;
    }

    .shell {
      width: 100%; max-width: var(--maxw); background: var(--card); border-radius: 24px; box-shadow: var(--shadow);
      display: flex; flex-direction: column; overflow: hidden; border: 1px solid #e5e7eb;
      height: min(80vh, 700px); /* NEW: prevents feed overlaying composer */
    }

    .topbar { position: relative; background: linear-gradient(180deg, #fff, #fafafa); padding: 14px 16px; border-bottom: 1px solid #eee; }
    .brand {
      display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .2px;
    }
    .badge { width: 28px; height: 28px; border-radius: 999px; background: var(--brand); display: grid; place-items: center; color: #fff; font-weight: 800; }
    .subtitle { color: var(--muted); font-size: 12px; margin-top: 2px; }

    .feed {
      padding: 16px;
      flex: 1;          /* NEW */
      min-height: 0;    /* NEW */
      overflow-y: auto;
      background: url('') center/cover no-repeat;
    }
    .row { display: flex; gap: 10px; margin: 10px 0; align-items: flex-end; }
    .row.bot { justify-content: flex-start; }
    .row.user { justify-content: flex-end; }

    .bubble { max-width: 80%; padding: 10px 14px; border-radius: var(--radius); }
    .bot .bubble { background: var(--bot); border-bottom-left-radius: 6px; }
    .user .bubble { background: var(--user); color: var(--user-text); border-bottom-right-radius: 6px; }

    .typing { display: inline-block; min-width: 36px; }
    .typing span { display: inline-block; width: 6px; height: 6px; margin-right: 4px; background: #cbd5e1; border-radius: 50%; animation: bounce 1s infinite ease-in-out; }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .5 } 40% { transform: translateY(-4px); opacity: 1 } }

    .composer {
      display: flex; gap: 10px; padding: 12px; border-top: 1px solid #eee; background: #fafafa;
      position: sticky; bottom: 0; z-index: 5; /* NEW: keeps button clickable */
    }
    .composer input[type="text"] { flex: 1; border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px 14px; outline: none; }
    .composer button { background: var(--brand); color: #fff; border: 0; border-radius: 12px; padding: 0 16px; font-weight: 600; cursor: pointer; }
    .composer button:disabled { opacity: .6; cursor: not-allowed; }

    .chips { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { background: #eef2ff; color: #3730a3; padding: 6px 10px; border-radius: 999px; font-size: 13px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="shell" id="app">
    <div class="topbar">
      <div class="brand">
        <div class="badge">CC</div>
        <div>
          Campus Compass
          <div class="subtitle">Radboud University</div>
        </div>
      </div>
    </div>

    <div class="feed" id="feed" aria-live="polite"></div>

    <div class="composer">
      <input id="input" type="text" placeholder="Type your message…" autocomplete="off" />
      <button id="send">Send</button>
    </div>
  </div>

  <script>
    // Wrap everything so a missing id can't kill the whole script
    window.addEventListener("DOMContentLoaded", () => {
      // --- DOM refs
      const FEED = document.getElementById('feed');
      const INPUT = document.getElementById('input');
      const SEND  = document.getElementById('send');

      if (!FEED || !INPUT || !SEND) {
        console.error("Missing DOM element(s). Check ids:", { FEED, INPUT, SEND });
        return;
      }

      // Detect of we lokaal dev draaien (run-dev.ps1) of live achter Caddy
      const runningLocal = (
        window.location.port === "5500" ||
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1" ||
        window.location.hostname === "::1" ||
        window.location.hostname === "[::1]"
      );

      // Base URLs voor de bot
      const LOCAL_API = "http://localhost:5005";                 // lokale Rasa core op je laptop
      const PROD_API  = "/rasa";                                 // in productie via Caddy proxy
      const VPS_API   = "https://campuscompass.egheosa.nl/rasa"; // directe fallback naar je VPS

      // Primair vs fallback:
      // lokaal: probeer eerst localhost:5005, val dan terug op de VPS
      // prod:   gebruik gewoon /rasa
      let PRIMARY_BASE, FALLBACK_BASE;
      if (runningLocal) {
        PRIMARY_BASE  = LOCAL_API;
        FALLBACK_BASE = PRIMARY_BASE;
      } else {
        PRIMARY_BASE  = PROD_API;
        FALLBACK_BASE = PROD_API;
      }

      console.log("[ENV] runningLocal:", runningLocal, "PRIMARY_BASE:", PRIMARY_BASE, "FALLBACK_BASE:", FALLBACK_BASE);

      // vaste sender id zodat Rasa een gesprek kan onthouden
      let senderId = localStorage.getItem('campuscompass_uid');
      if (!senderId) {
        senderId = 'web-' + Math.random().toString(36).slice(2) + Date.now();
        localStorage.setItem('campuscompass_uid', senderId);
      }

      const scrollToBottom = () =>
        FEED.scrollTo({ top: FEED.scrollHeight, behavior: 'smooth' });

      function bubble(role, html) {
        const row = document.createElement('div');
        row.className = `row ${role}`;

        const b = document.createElement('div');
        b.className = 'bubble';
        b.innerHTML = html;

        row.appendChild(b);
        FEED.appendChild(row);
        scrollToBottom();
        return row;
      }

      function typingOn() {
        const row = document.createElement('div');
        row.className = 'row bot';

        const b = document.createElement('div');
        b.className = 'bubble typing';
        b.innerHTML = '<span></span><span></span><span></span>';

        row.appendChild(b);
        FEED.appendChild(row);
        scrollToBottom();
        return row;
      }

      function strip(s) {
        return (s || '')
          .toString()
          .replace(/</g,'&lt;')
          .replace(/>/g,'&gt;');
      }

      // één request sturen naar een bepaalde baseURL
      async function postToRasa(baseUrl, text) {
        const rasaUrl = baseUrl + "/webhooks/rest/webhook";

        console.log("[CLIENT] POST", rasaUrl, "sender", senderId);

        const res = await fetch(rasaUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sender: senderId,
            message: text
          })
        });

        console.log("[CLIENT] status:", res.status);
        const data = await res.json();
        console.log("[CLIENT] data:", data);

        return { ok: res.ok, data };
      }

      async function sendMessage(text) {
        if (!text) return;

        console.log("[CLIENT] user typed:", text);

        // user bubble
        INPUT.value = '';
        bubble('user', strip(text));

        const typing = typingOn();

        let answer = null;
        // 1. Probeer primary
        try {
          answer = await postToRasa(PRIMARY_BASE, text);
          if (!answer.ok || !Array.isArray(answer.data)) {
            throw new Error("Primary bad response");
          }
        } catch (errPrimary) {
          console.warn("[CLIENT] primary failed:", errPrimary);

          // 2. fallback als fallback anders is
          if (FALLBACK_BASE !== PRIMARY_BASE) {
            try {
              console.log("[CLIENT] trying fallback:", FALLBACK_BASE);
              answer = await postToRasa(FALLBACK_BASE, text);
              if (!answer.ok || !Array.isArray(answer.data)) {
                throw new Error("Fallback bad response");
              }
            } catch (errFallback) {
              console.error("[CLIENT] fallback also failed:", errFallback);
              typing.remove();
              bubble('bot', '<em>I can\'t seem to reach the Rasa server... Please check your connection.</em>');
              return;
            }
          } else {
            typing.remove();
            bubble('bot', '<em>I can\'t seem to reach the Rasa server... Please check your connection.</em>');
            return;
          }
        }

        typing.remove();

        const msgs = answer.data;
        if (!Array.isArray(msgs) || !msgs.length) {
          console.warn("[CLIENT] empty response from Rasa (silent flow).");
          return;
        }

        for (const m of msgs) {
          const hasButtons = !!(m.buttons && m.buttons.length);
          const hasImage = !!m.image;
          const hasText = !!m.text;

          // niets te tonen? skip
          if (!hasText && !hasImage && !hasButtons) continue;

          // 1 bubble per message
          const initialHtml = hasText ? strip(m.text) : (hasButtons ? '<strong>Choices</strong>' : '');
          const row = bubble('bot', initialHtml);
          const bubbleEl = row.querySelector('.bubble');

          if (hasImage) {
            const img = document.createElement('img');
            img.src = (m.image || '').toString();
            img.alt = 'Route map';
            img.style.maxWidth = '100%';
            img.style.borderRadius = '12px';
            bubbleEl.appendChild(img);
          }

          if (hasButtons) {
            const wrap = document.createElement('div');
            wrap.className = 'chips';

            m.buttons.forEach(btn => {
              const el = document.createElement('div');
              el.className = 'chip';
              el.textContent = btn.title || btn.payload;

              el.onclick = () => {
                const url =
                  (typeof btn.url === "string" && btn.url.trim().match(/^https?:\/\//i) ? btn.url.trim() : null) ||
                  (typeof btn.payload === "string" && btn.payload.trim().match(/^\/https?:\/\//i) ? btn.payload.trim().slice(1) : null) ||
                  (typeof btn.payload === "string" && btn.payload.trim().match(/^https?:\/\//i) ? btn.payload.trim() : null);

                if (url) {
                  window.open(url, "_blank", "noopener,noreferrer");
                  return;
                }

                sendMessage(btn.payload || btn.title);
              };

              wrap.appendChild(el);
            });

            bubbleEl.appendChild(wrap);
          }
        }

      }

      SEND.addEventListener('click', () => sendMessage(INPUT.value.trim()));
      INPUT.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') SEND.click();
      });

      // Greeting bubble (UI-side only, geen echte bot call)
      bubble('bot', 'Hi! 👋 My name is CampusCompass. Can I help you?');
    });
  </script>
</body>
</html>
