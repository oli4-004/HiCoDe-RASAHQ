version: "3.1"

intents:
  - greet
  - goodbye
  - thanks
  - chitchat
  - ask_abbreviation
  - affirm
  - deny
  - ask_route_description

entities:
  - building

slots:
  # ---------------------------------------------------------------------------
  # ABBREVIATIONS (abbreviation_flow)
  # ---------------------------------------------------------------------------
  abbreviation_raw:
    type: text
    influence_conversation: false
    mappings:
      - type: from_llm

  # ---------------------------------------------------------------------------
  # FALLBACK / REPAIR LOGIC (fallback_flow, pattern_clarification, etc.)
  # ---------------------------------------------------------------------------
  fallback_attempts:
    type: float
    initial_value: 0
    influence_conversation: false

  confirm_correction:
    type: bool
    influence_conversation: false
    mappings:
      - type: from_llm

  continue_interrupted_flow_confirmation:
    type: bool
    influence_conversation: false
    mappings:
      - type: from_llm

  docs_status:
    type: text
    influence_conversation: false

  docs_need_info_question:
    type: text
    influence_conversation: false

  # ---------------------------------------------------------------------------
  # ROUTE & TRAVEL (route_description_flow, ask_travel_time)
  # ---------------------------------------------------------------------------
  # Raw building mentions exactly as the user says them (e.g. "HG", "COM B").
  source_building_raw:
    type: text
    influence_conversation: false
    mappings:
      - type: from_llm

  target_building_raw:
    type: text
    influence_conversation: false
    mappings:
      - type: from_llm

  prev_source_building_raw:
    type: text
    influence_conversation: false

  prev_target_building_raw:
    type: text
    influence_conversation: false

  travel_mode_hint:
    type: text
    initial_value: "unknown"
    influence_conversation: false
    mappings:
      - type: from_llm

responses:
  # ---------------------------------------------------------------------------
  # GREETING / GOODBYE / THANKS  (greet_flow, goodbye_flow, thanks_flow)
  # ---------------------------------------------------------------------------
  utter_greet:
    - text: "Hi! How can I help you today?"

  utter_goodbye:
    - text: "Bye! Good luck on campus."

  utter_reply_thanks:
    - text: "You are welcome! Is there anything else I can help you with?"

  # ---------------------------------------------------------------------------
  # Mental health issues (mental_health_*_flow)
  # ---------------------------------------------------------------------------
  utter_severe_mental_health_support:
    - text: |
        I am really sorry that you are going through this. 💚
        CampusCompass cannot support with mental health or crisis situations.
        If you are in immediate danger or thinking about harming yourself, please call 112 right away.
        For suicidal thoughts, you can contact 113 Suicide Prevention (by calling 113 or via their website).
        It can really help to tell someone you trust, such as a friend, family member, GP, or study advisor. You do not have to go through this alone. I hope things will get better for you.

  utter_light_mental_health_support:
    - text: |
        I am really sorry that you are going through this. 💚
        CampusCompass cannot support with mental health situations.
        It can really help to tell someone you trust, such as a friend, family member, GP, or study advisor. You do not have to go through this alone. I hope things will get better for you.

  # ---------------------------------------------------------------------------
  # SMALLTALK (smalltalk_flow)
  # ---------------------------------------------------------------------------
  utter_free_chitchat_response:
    - text: "Just so you know: I am mainly here to help with campus directions, building and room codes, or quick facts like opening hours. If you need anything else, please refer to the appropriate resources."

  # ---------------------------------------------------------------------------
  # ABBREVIATIONS (abbreviation_flow)
  # ---------------------------------------------------------------------------
  utter_ask_abbreviation_raw:
    - text: "Sure, tell me the abbreviation or room code you are confused about."

  # ---------------------------------------------------------------------------
  # ROUTE & TRAVEL (route_description_flow, ask_travel_time)
  # ---------------------------------------------------------------------------
  # These are used automatically when collecting source_building_raw / target_building_raw.
  utter_ask_source_building_raw:
    - text: "Where are you now? Please provide the building or building code, e.g. COM, CC, HG."

  utter_ask_target_building_raw:
    - text: "Where do you want to go? Please provide the building or building code, e.g. COM, CC, HG."

  utter_route_api_error:
    - text: "Currently I am unable to get you the correct route myself. I recommend using Google Maps."

  utter_ask_travel_mode_hint:
    - text: "Do you want to walk, cycle, drive or use public transport (bus/train)?"

  # ---------------------------------------------------------------------------
  # FALLBACK / OUT-OF-SCOPE (fallback_flow)
  # ---------------------------------------------------------------------------
  utter_fallback_rephrase:
    - text: "I didn’t quite get that—could you rephrase? I can help with things like directions, building/room codes, and campus facilities (e.g., opening hours)."

  utter_docs_need_info_question:
    - text: "{docs_need_info_question}"

  # ---------------------------------------------------------------------------
  # RASA PATTERN RESPONSE OVERRIDES
  # ---------------------------------------------------------------------------
  utter_human_handoff_not_available:
    - text: "I understand you might want to talk to a human, but I cannot connect you to a person. Is there something else I can help you with on campus?"
      metadata:
        rephrase: true

  utter_internal_error_rasa:
    - text: "Sorry, I am having trouble with that. Please try again in a few minutes."

actions:
  # ---------------------------------------------------------------------------
  # SMALLTALK
  # ---------------------------------------------------------------------------
  - action_smalltalk_llm

  # ---------------------------------------------------------------------------
  # ROUTES & TRAVEL MODE
  # ---------------------------------------------------------------------------
  - action_llm_prefill_route_slots
  - action_llm_prefill_travel_mode
  - action_get_route_description
  - action_clear_route_context
  - action_use_prev_route_slots

  # ---------------------------------------------------------------------------
  # ABBREVIATIONS
  # ---------------------------------------------------------------------------
  - action_llm_prefill_abbreviation
  - action_clear_abbreviation_context

  # ---------------------------------------------------------------------------
  # FALLBACK
  # ---------------------------------------------------------------------------
  - action_cannot_handle
  - action_increment_fallback_attempts
  - action_trigger_search